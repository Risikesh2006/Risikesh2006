name: Refresh profile graphics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-profile.mjs'
      - '.github/workflows/profile-assets.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate graphics from GitHub data
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
      - name: Save refreshed graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile graphics"
          git pull --rebase origin main
          git push origin HEAD:main
